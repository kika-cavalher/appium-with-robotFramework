name: Run Robot Signup Tests - Local Emulator CI

permissions:
  contents: read
  actions: write

on:
  push:
    branches: ["main", "signup"]
  workflow_dispatch:

jobs:
  robot-tests:
    runs-on: ubuntu-latest

    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: 📆 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install beautifulsoup4

      - name: ☕ Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔐 Enable KVM permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: 🔵 Setup Node.js and Install Appium
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install -g appium
          appium driver install uiautomator2

      - name: 🚀 Start Appium server
        run: |
          nohup appium --port=4723 --address=127.0.0.1 --relaxed-security --base-path /wd/hub > appium.log 2>&1 &

      - name: 🔍 Check Appium readiness
        run: |
          echo "Waiting for Appium server to be ready..."
          timeout 60s bash -c 'until curl --silent --fail http://127.0.0.1:4723/wd/hub/status > /dev/null; do sleep 2; done'

      - name: 📲 Start ADB log capture
        run: nohup adb logcat > adb-logcat.log &

      - name: 📱 Run Android Emulator and Robot Tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_4
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            echo "⏳ Waiting for Android boot..."
            timeout 180s bash -c 'until adb shell getprop sys.boot_completed | grep -m 1 1; do sleep 2; done'

            echo "✅ Boot completed. Waiting for Appium connection to emulator..."
            timeout 60s bash -c 'until adb devices | grep -m 1 "device$"; do sleep 2; done'

            echo "📱 Emulator is ready, running Robot tests..."
            mkdir -p .log
            robot --outputdir .log tests/EVIO/mobile/signup.robot || echo "Robot tests failed to execute"

      - name: 📧 Send Debug Email
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.office365.com
          server_port: 587
          username: erica.cavalher@go-evio.com
          password: ${{ secrets.EMAIL_PASSWORD }}
          subject: "Robot Framework Android Test Summary"
          to: erica.cavalher@go-evio.com
          from: erica.cavalher@go-evio.com
          content_type: text/plain
          body: |
            📦 Client: EVIO
            🧪 Executed test: Signup (full flow)
            📅 Status: ${{ job.status }}

            ${{ job.status == 'success' && '
            ✅ Test results:
            - TC-01.01.01 - Successful account creation: ✅ Passed
            - TC-01.01.02 - Weak password warning: ✅ Passed
            - TC-01.01.03 - Attempt to sign up with already registered number: ✅ Passed
            - TC-01.01.04 - Attempt to sign up with already registered email: ✅ Passed
            - TC-01.01.14 - Upload a profile picture: ✅ Passed
            ' || '' }}

            🔍 Open the attached HTML report for the full results.
          attachments: |
            .log/report.html
